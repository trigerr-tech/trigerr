[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trigerr"
# Version is single-sourced from trigerr/__init__.py's __version__ —
# bump it there only; the build reads it via the dynamic attr below.
dynamic = ["version"]
description = "Python tools for quantitative trading research and analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anurag Singh Kushwah" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "redis>=5.0.8,<6",
    "pymongo>=4.0",
    "numba>=0.57",
    "tqdm>=4.0",
    "cryptography>=42",
    "trigerr-logging>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
]

[tool.setuptools.dynamic]
version = {attr = "trigerr.__version__"}

[tool.setuptools.packages.find]
include = ["trigerr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
